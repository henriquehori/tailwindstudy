<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modif</title>
    <link href="./output.css" rel="stylesheet" />
</head>

<body class="m-8">
    <div>
        <input type="radio" name="produto" value="nimbus" id="nimbus" class="peer mr-1" />
        <label for="nimbus" class="inline-grid grid-cols-[200px_auto] bg-purple-200 peer-checked:bg-purple-400 hover:bg-purple-300 cursor-pointer p-2 rounded-md my-2 peer-checked:hover:bg-purple-400">Nimbus Stark<span>R$ 4999</span></label>
        <ul class="bg-purple-200 rounded-md p-2 ml-5 w-md hidden peer-checked:block">
            <li>Motor Elétrico</li>
            <li>Fibra de Carbono</li>
            <li>50 km/h</li>
            <li>Rastreador</li>
        </ul>
    </div>

    <div>
        <input type="radio" name="produto" value="magic" id="magic" class="peer mr-1" />
        <label for="magic" class="inline-grid grid-cols-[200px_auto] bg-purple-200 peer-checked:bg-purple-400 hover:bg-purple-300 cursor-pointer p-2 rounded-md my-2 peer-checked:hover:bg-purple-400">Magic Might<span>R$ 2499</span></label>
        <ul class="bg-purple-200 rounded-md p-2 ml-5 w-md hidden peer-checked:block">
            <li>Motor Elétrico</li>
            <li>Fibra de Carbono</li>
            <li>45 km/h</li>
            <li>Rastreador</li>
        </ul>
    </div>

    <div>
        <input type="radio" name="produto" value="nebula" id="nebula" class="peer mr-1" />
        <label for="nebula" class="inline-grid grid-cols-[200px_auto] bg-purple-200 peer-checked:bg-purple-400 hover:bg-purple-300 cursor-pointer p-2 rounded-md my-2 peer-checked:hover:bg-purple-400">Nebula Cosmic<span>R$ 3999</span></label>
        <ul class="bg-purple-200 rounded-md p-2 ml-5 w-md hidden peer-checked:block">
            <li>Motor Elétrico</li>
            <li>Fibra de Carbono</li>
            <li>40 km/h</li>
            <li>Rastreador</li>
        </ul>
    </div>
</body>
